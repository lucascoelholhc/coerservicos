spring:
  application:
    name: coe-servicos
  autoconfigure:
    # sem usuário em memória com senha gerada: o login é o da COE (CORE-03)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coeservicos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    properties:
      # SMTP travado não prende as threads de envio para sempre (a fila enche e descarta)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      # Upload de foto (CORE-09): acima de 8 MB por categoria o validador recusa; aqui a folga do multipart.
      # O filtro de corpo só deixa passar disso nas RotasDeUpload; no resto da API, 64 KB.
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails.enabled: true      # erros em Problem Details (RFC 9457)
  jackson:
    deserialization:
      # campo desconhecido no JSON = 400 em toda a API (barra mass assignment).
      # Exceção planejada: o webhook do gateway (DOM-07) guarda o corpo bruto e lê de forma tolerante.
      fail-on-unknown-properties: true
  web:
    locale: pt_BR                     # mensagens de validação em português
    locale-resolver: fixed

coe:
  cifra:
    # Criptografia de campo (CORE-10): CPF, chave Pix e endereço em AES-256-GCM; CPF também como HMAC.
    # Obrigatórias em todo perfil (sem elas a aplicação não sobe). Em prod, do Secrets Manager (AWS-04).
    kid-atual: ${COE_CIFRA_KID_ATUAL:}
    chaves: ${COE_CIFRA_CHAVES:}
    chave-hmac-cpf: ${COE_CHAVE_HMAC_CPF:}
  armazenamento:
    # Bucket privado dos arquivos (CORE-09). Em produção: S3 da AWS com o papel IAM da tarefa, sem
    # endpoint nem chaves (o bucket é criado na AWS-04). Endpoint e chaves só no local e no test.
    bucket: ${COE_S3_BUCKET:}
    regiao: ${COE_S3_REGIAO:sa-east-1}
    validade-url: 5m           # URL assinada de leitura (teto de 15 min)
    kms-key-id: ${COE_S3_KMS_KEY_ID:}   # SSE-KMS; vazio = criptografia padrão do bucket
    imagem:
      # Validação do upload (RNF07, decidido em 14/10). O multipart (spring.servlet.multipart) cobre o maior.
      tamanho-maximo:
        documento: 8MB
        selfie: 8MB
        portfolio: 8MB
        pedido: 8MB
        evidencia: 8MB
        disputa: 8MB
      pixels-maximo: 40000000      # pelo cabeçalho, antes de decodificar (teto: 40 milhões)
      lado-maximo: 2560            # lado maior da imagem gravada
      processamentos-simultaneos: 2   # imagens decodificadas ao mesmo tempo por instância (memória)
      espera-por-vaga: 5s          # sem vaga nesse prazo = 503
      qualidade-jpeg: 0.85
  cadastro:
    # URL assinada de documento e selfie: curta e só para o dono (o ADMIN tem a dele no DOM-03; RN16)
    validade-url-documento: 2m
  front:
    # Base dos links mandados por e-mail (token no fragmento #token=...). Obrigatória; em prod só https.
    url-base: ${COE_FRONT_URL_BASE:}
  email:
    # Remetente dos e-mails (obrigatório quando há SMTP). O SMTP vem de spring.mail.* (SPRING_MAIL_HOST,
    # SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD); sem ele a aplicação não sobe.
    remetente: ${COE_EMAIL_REMETENTE:}
  jwt:
    # Variáveis de ambiente obrigatórias (sem elas a aplicação não sobe):
    # COE_JWT_KID_ATUAL=2026-10   COE_JWT_CHAVES=2026-10:<base64 de 32 bytes>[,kid-anterior:<base64>]
    kid-atual: ${COE_JWT_KID_ATUAL:}
    chaves: ${COE_JWT_CHAVES:}
  seguranca:
    # Origens do front (CORS e Origin no renovar/sair), separadas por vírgula; sem curinga, caminho nem
    # barra no fim. Obrigatório: sem isso a aplicação não sobe. Prod: COE_ORIGENS_PERMITIDAS (só https).
    origens-permitidas: ${COE_ORIGENS_PERMITIDAS:}
    # Chave do HMAC dos códigos SMS (base64 de pelo menos 32 bytes), separada da do JWT.
    # Obrigatória: sem ela a aplicação não sobe. Variável de ambiente COE_CHAVE_CODIGOS.
    chave-codigos: ${COE_CHAVE_CODIGOS:}
    codigos:
      # Contador de falhas (decisão de 07/10): erros na janela bloqueiam toda entrada por código da conta.
      falhas-para-bloqueio: 10
      janela-falhas: 24h
      duracao-bloqueio: 1h
    origens-somente-https: false
    hsts: false            # só o application-prod.yml liga
  limites:
    # Rate limit (CORE-07, decidido em 14/10; números revistos com dados reais depois do lançamento).
    # Técnicos, por perfil: não vão na tabela configuracao. Janela = repõe tudo no fim dela.
    lock-timeout: 200ms        # trava de um balde no Postgres (SET LOCAL); estourou = 429 com espera-na-disputa
    espera-na-disputa: 1s
    conexoes: 5                # pool próprio do limitador (não esgota o da aplicação)
    espera-por-conexao: 500ms  # sem conexão nesse prazo = 503
    corpo-maximo: 64KB         # corpo das requisições em /api/** (413 acima)
    corpo-maximo-upload: ${spring.servlet.multipart.max-request-size}   # só nas RotasDeUpload, com multipart (CORE-09)
    limpeza: 5m                # apaga os baldes vencidos (frequente: a tabela cresce numa inundação)
    regras:
      # em memória (por instância)
      api-ip: { capacidade: 300, janela: 1m }
      publico-ip: { capacidade: 60, janela: 1m }
      # no Postgres, por IP (FiltroDeLimites/RotasLimitadas)
      entrar-ip: { capacidade: 30, janela: 10m }
      segundo-passo-ip: { capacidade: 20, janela: 10m }
      codigo-ip: { capacidade: 10, janela: 1h }
      entrar-com-codigo-ip: { capacidade: 20, janela: 10m }
      renovar-ip: { capacidade: 60, janela: 1m }
      esqueci-ip: { capacidade: 10, janela: 1h }
      redefinir-ip: { capacidade: 20, janela: 1h }
      cadastro-ip: { capacidade: 30, janela: 1h }
      posse-ip: { capacidade: 10, janela: 1h }
      posse-confirmar-ip: { capacidade: 20, janela: 10m }
      confirmar-email-ip: { capacidade: 20, janela: 10m }
      upload-ip: { capacidade: 60, janela: 1h }   # uploads do cadastro (DOM-02)
      dados-ip: { capacidade: 30, janela: 24h }   # CPF do cadastro: contra enumeração pelo 409 (DOM-02)
      # no Postgres, globais (fatias: a chave é dividida em N linhas sorteadas, H1)
      cadastro-global: { capacidade: 500, janela: 1h, fatias: 10 }
      envio-normal-global: { capacidade: 300, janela: 1h, fatias: 10 }
      # no Postgres, por login, celular e usuário (nos serviços)
      entrar-login-ip: { capacidade: 8, janela: 15m }
      entrar-login: { capacidade: 20, janela: 1h }
      entrar-com-codigo-celular: { capacidade: 10, janela: 10m }
      trocar-senha-usuario: { capacidade: 5, janela: 15m }
      contato-usuario: { capacidade: 5, janela: 1h }
      envio-usuario: { capacidade: 10, janela: 1h }
      confirmar-usuario: { capacidade: 20, janela: 10m }
      cadastro-usuario: { capacidade: 120, janela: 1h }   # etapas do cadastro do profissional (DOM-02)
      upload-usuario: { capacidade: 30, janela: 1h }      # fotos e documentos: decodificar imagem custa caro
      dados-usuario: { capacidade: 10, janela: 24h }      # CPF e nascimento: poucas trocas por dia (enumeração)
      admin-usuario: { capacidade: 600, janela: 1h }      # fila, decisões e arquivos da verificação (DOM-03)
      admin-detalhe-usuario: { capacidade: 120, janela: 1h }   # detalhe com CPF completo (DOM-03)
  mensageria:
    # Envio assíncrono de SMS e e-mail depois do commit (decisão de 07/10): filas próprias e limitadas.
    # Fila cheia descarta com log mascarado e devolve a cota da linha (CORE-07); a resposta não muda.
    prioritaria:     # código de login, MFA, recuperação de senha
      threads: 2
      threads-maximo: 4
      fila: 100
    normal:          # prova de posse, confirmação de celular e e-mail
      threads: 1
      threads-maximo: 2
      fila: 50
  auth:
    sessao:
      duracao-maxima: 90d   # teto absoluto desde o login (PA03); depois disso, senha de novo
    cookie:
      secure: true      # o local (http://localhost) desliga no application-local.yml
      dominio:          # vazio = só o host que respondeu

logging:
  level:
    # O Hibernate loga a mensagem do Postgres ("Failing row contains (...)", "Key (email)=(...)") com
    # dado pessoal antes de o Spring traduzir a exceção; o TratadorDeErros já loga só o que importa (CORE-11).
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
  pattern:
    # Id da requisição (CORE-11) em toda linha do log em texto (local e test); no JSON do prod vai pelo MDC.
    correlation: "[%X{requisicao:-}] "

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
