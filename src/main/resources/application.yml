spring:
  application:
    name: coe-servicos
  autoconfigure:
    # sem usuário em memória com senha gerada: o login é o da COE (CORE-03)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coeservicos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails.enabled: true      # erros em Problem Details (RFC 9457)
  jackson:
    deserialization:
      # campo desconhecido no JSON = 400 em toda a API (barra mass assignment).
      # Exceção planejada: o webhook do gateway (DOM-07) guarda o corpo bruto e lê de forma tolerante.
      fail-on-unknown-properties: true
  web:
    locale: pt_BR                     # mensagens de validação em português
    locale-resolver: fixed

coe:
  jwt:
    # Variáveis de ambiente obrigatórias (sem elas a aplicação não sobe):
    # COE_JWT_KID_ATUAL=2026-10   COE_JWT_CHAVES=2026-10:<base64 de 32 bytes>[,kid-anterior:<base64>]
    kid-atual: ${COE_JWT_KID_ATUAL:}
    chaves: ${COE_JWT_CHAVES:}
  auth:
    sessao:
      duracao-maxima: 90d   # teto absoluto desde o login (PA03); depois disso, senha de novo
    cookie:
      secure: true      # o local (http://localhost) desliga no application-local.yml
      dominio:          # vazio = só o host que respondeu

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
