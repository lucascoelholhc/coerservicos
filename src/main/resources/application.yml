spring:
  application:
    name: coe-servicos
  config:
    # O Spring não lê .env sozinho: importa como properties (opcional, só existe local)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coeservicos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
