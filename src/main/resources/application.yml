spring:
  application:
    name: coe-servicos
  autoconfigure:
    # sem usuário em memória com senha gerada: o login é o da COE (CORE-03)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coeservicos}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails.enabled: true      # erros em Problem Details (RFC 9457)
  jackson:
    deserialization:
      # campo desconhecido no JSON = 400 em toda a API (barra mass assignment).
      # Exceção planejada: o webhook do gateway (DOM-07) guarda o corpo bruto e lê de forma tolerante.
      fail-on-unknown-properties: true
  web:
    locale: pt_BR                     # mensagens de validação em português
    locale-resolver: fixed

coe:
  jwt:
    # Variáveis de ambiente obrigatórias (sem elas a aplicação não sobe):
    # COE_JWT_KID_ATUAL=2026-10   COE_JWT_CHAVES=2026-10:<base64 de 32 bytes>[,kid-anterior:<base64>]
    kid-atual: ${COE_JWT_KID_ATUAL:}
    chaves: ${COE_JWT_CHAVES:}
  seguranca:
    # Origens do front (CORS e Origin no renovar/sair), separadas por vírgula; sem curinga, caminho nem
    # barra no fim. Obrigatório: sem isso a aplicação não sobe. Prod: COE_ORIGENS_PERMITIDAS (só https).
    origens-permitidas: ${COE_ORIGENS_PERMITIDAS:}
    # Chave do HMAC dos códigos SMS (base64 de pelo menos 32 bytes), separada da do JWT.
    # Obrigatória: sem ela a aplicação não sobe. Variável de ambiente COE_CHAVE_CODIGOS.
    chave-codigos: ${COE_CHAVE_CODIGOS:}
    codigos:
      # Contador de falhas (decisão de 07/10): erros na janela bloqueiam toda entrada por código da conta.
      falhas-para-bloqueio: 10
      janela-falhas: 24h
      duracao-bloqueio: 1h
    origens-somente-https: false
    hsts: false            # só o application-prod.yml liga
  mensageria:
    # Envio assíncrono de SMS e e-mail depois do commit (decisão de 07/10): fila própria e limitada.
    # Fila cheia descarta com log mascarado; a resposta da requisição nunca muda.
    threads: 2
    threads-maximo: 4
    fila: 100
  auth:
    sessao:
      duracao-maxima: 90d   # teto absoluto desde o login (PA03); depois disso, senha de novo
    cookie:
      secure: true      # o local (http://localhost) desliga no application-local.yml
      dominio:          # vazio = só o host que respondeu

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
