# Perfil de produção (e homologação). Segredos só por variável de ambiente:
#   DB_URL, DB_USER, DB_PASSWORD           -> login da aplicação (membro do papel coe_app)
#   SPRING_FLYWAY_USER, SPRING_FLYWAY_PASSWORD -> dono do schema, só para as migrações
spring:
  flyway:
    locations: classpath:db/migration   # nunca db/local (seed com senha pública)
    clean-disabled: true
  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  # Atrás do ALB (HTTPS terminado nele). "native" = RemoteIpValve do Tomcat: getRemoteAddr() passa a
  # ser o IP real do cliente (prova do aceite dos termos, rate limit), mas só confia no
  # X-Forwarded-For vindo de IP interno (padrão do Tomcat: 10/8, 172.16/12, 192.168/16, 127/8).
  # Na etapa AWS, conferir que o ALB está em sub-rede privada e restringir os proxies se preciso.
  forward-headers-strategy: native
