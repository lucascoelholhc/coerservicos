# O Spring não lê .env sozinho: importa como properties. Só no perfil local:
# em produção os segredos vêm de variáveis de ambiente, nunca de arquivo.
spring.config.import: optional:file:.env[.properties]
spring.flyway.locations: classpath:db/migration,classpath:db/local
# Trava do seed local (R__dados_local.sql): só roda com ambiente = local
spring.flyway.placeholders.ambiente: local
# A 8080 da máquina de desenvolvimento é usada pelo Apache (serviço do Windows): o local sobe na 8081.
server.port: 8081
# Local roda em http://localhost: cookie do refresh sem Secure
coe.auth.cookie.secure: false
# Front local (Vite)
coe.seguranca.origens-permitidas: http://localhost:5173
# Links por e-mail apontam para o front local; e-mail vai para o Mailpit (painel http://localhost:8025)
coe.front.url-base: http://localhost:5173
coe.email.remetente: nao-responda@coe.local
spring.mail.host: localhost
spring.mail.port: 1025
