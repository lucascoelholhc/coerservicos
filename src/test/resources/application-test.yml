# Perfil dos testes (ativado pela IntegracaoTest). O banco vem do Testcontainers
# (@ServiceConnection), então nenhuma credencial é lida daqui nem do .env.
spring:
  flyway:
    locations: classpath:db/migration   # sem o seed local
    clean-disabled: true

# Chaves do JWT SÓ para testes (não são segredo; nunca usar fora do perfil test).
# teste-2 é a atual; teste-1 é a anterior, ainda aceita na validação (rotação).
coe:
  seguranca:
    origens-permitidas: http://localhost:5173
    origem-das-imagens: http://localhost:8333
    # Chave do HMAC dos códigos SMS SÓ para testes (não é segredo).
    chave-codigos: Wm9QbFdGd0x6ZlZ3d2xjR2Y2bVNqN0F1a0Y2cTZhS2k=
  front:
    url-base: http://localhost:5173
  gateway:
    # Token do webhook do gateway falso SÓ para testes (não é segredo)
    token-webhook: token-de-teste-do-webhook-do-gateway
  contrato:
    # o job de expiração não roda sozinho nos testes (o relógio é compartilhado); o teste chama executar()
    expiracao: 24h
    # a liberação automática também não roda sozinha nos testes; o teste chama executar()
    liberacao: 24h
  # Chaves da criptografia de campo SÓ para testes (não são segredo).
  cifra:
    kid-atual: teste-2
    chaves: teste-2:b3V0cm8tc2VncmVkby1kZS10ZXN0ZS0yLTMyLWJ5dGU=,teste-1:c2VncmVkby1kZS10ZXN0ZS0xLWNvbS0zMi1ieXRlcyE=
    chave-hmac-cpf: Y2hhdmUtZG8taG1hYy1kby1jcGYtc28tZGUtdGVzdGU=
  armazenamento:
    # Endpoint e chaves vêm do SeaweedFS do Testcontainers (TestcontainersConfiguration)
    bucket: coe-arquivos-teste
    regiao: us-east-1
    criar-bucket: true
  limites:
    conexoes: 4
    regras:
      # Só para os testes do LimitadorDeTaxa (CORE-07)
      teste-ip: { capacidade: 3, janela: 1m }
      teste-global: { capacidade: 40, janela: 1h, fatias: 4 }
      teste-ordem-ip: { capacidade: 2, janela: 1h }
      teste-ordem-global: { capacidade: 10, janela: 1h }
  jwt:
    kid-atual: teste-2
    chaves: teste-2:64cxK3KGrXaWz4l8l3eTpGwHnDHY9ust4wiQ1nC8+OM=,teste-1:wW+XYKypOvCgAc5BG5mlGksqdNbUDiXtlPMh4p43hxE=

logging:
  level:
    org.flywaydb: warn
    org.testcontainers: warn
