# Perfil dos testes (ativado pela IntegracaoTest). O banco vem do Testcontainers
# (@ServiceConnection), então nenhuma credencial é lida daqui nem do .env.
spring:
  flyway:
    locations: classpath:db/migration   # sem o seed local
    clean-disabled: true

# Chaves do JWT SÓ para testes (não são segredo; nunca usar fora do perfil test).
# teste-2 é a atual; teste-1 é a anterior, ainda aceita na validação (rotação).
coe:
  jwt:
    kid-atual: teste-2
    chaves: teste-2:64cxK3KGrXaWz4l8l3eTpGwHnDHY9ust4wiQ1nC8+OM=,teste-1:wW+XYKypOvCgAc5BG5mlGksqdNbUDiXtlPMh4p43hxE=

logging:
  level:
    org.flywaydb: warn
    org.testcontainers: warn
